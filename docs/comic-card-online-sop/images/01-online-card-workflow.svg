<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">赛博史记线上卡片化流程</title>
  <desc id="desc">从四宫格漫画到线上漫画卡片的六步流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7e8"/>
      <stop offset="55%" stop-color="#f1f7ff"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#60472b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bb7a38"/>
    </marker>
    <style>
      .title { font: 700 42px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #2b2118; }
      .subtitle { font: 400 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #7a6250; }
      .box-title { font: 700 26px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #2f251c; }
      .box-copy { font: 400 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #6a5544; }
      .badge { font: 700 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #fffaf1; }
      .tiny { font: 400 14px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #8a705b; }
      .arrow { stroke: #bb7a38; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="95" fill="#ffd66b" opacity="0.22"/>
  <circle cx="165" cy="640" r="130" fill="#9fd7e5" opacity="0.22"/>
  <path d="M80 118 C220 68, 315 164, 450 92 S735 82, 875 130 S1050 192, 1130 118" fill="none" stroke="#e9d4b8" stroke-width="3" stroke-dasharray="10 13"/>
  <text x="80" y="82" class="title">四宫格漫画 -> 线上收藏卡 SOP</text>
  <text x="82" y="116" class="subtitle">保留原作，把故事、情绪和创作意图转译成可浏览、可点击、可持续更新的网站卡片。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="300" height="150" rx="24" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="108" cy="216" r="22" fill="#d99a45"/>
    <text x="99" y="222" class="badge">1</text>
    <text x="145" y="220" class="box-title">收集输入</text>
    <text x="105" y="260" class="box-copy">漫画原图 / 创作日期</text>
    <text x="105" y="286" class="box-copy">期数标题 / 提示词故事</text>
    <text x="105" y="312" class="tiny">先确定“这期到底讲什么”。</text>
  </g>

  <path class="arrow" d="M380 255 H465"/>

  <g filter="url(#shadow)">
    <rect x="485" y="180" width="300" height="150" rx="24" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="523" cy="216" r="22" fill="#6ca6b8"/>
    <text x="514" y="222" class="badge">2</text>
    <text x="560" y="220" class="box-title">提炼卡片 DNA</text>
    <text x="520" y="260" class="box-copy">故事核 / 情绪 / 视觉锚点</text>
    <text x="520" y="286" class="box-copy">点题句 / 系列位置</text>
    <text x="520" y="312" class="tiny">避免只换图，不理解内容。</text>
  </g>

  <path class="arrow" d="M795 255 H880"/>

  <g filter="url(#shadow)">
    <rect x="900" y="180" width="230" height="150" rx="24" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="938" cy="216" r="22" fill="#c782a7"/>
    <text x="929" y="222" class="badge">3</text>
    <text x="975" y="220" class="box-title">固定骨架</text>
    <text x="935" y="260" class="box-copy">封面 / 日期 / 期数</text>
    <text x="935" y="286" class="box-copy">标题 / 简介 / 全图入口</text>
    <text x="935" y="312" class="tiny">系列稳定，读者好扫读。</text>
  </g>

  <path class="arrow" d="M1015 340 C1015 390, 925 394, 875 420"/>

  <g filter="url(#shadow)">
    <rect x="780" y="430" width="350" height="150" rx="24" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="818" cy="466" r="22" fill="#8070b8"/>
    <text x="809" y="472" class="badge">4</text>
    <text x="855" y="470" class="box-title">主题外衣</text>
    <text x="815" y="510" class="box-copy">根据故事选择色彩、图标、语气</text>
    <text x="815" y="536" class="box-copy">但不改漫画、不烘焙文字</text>
    <text x="815" y="562" class="tiny">卡片解释原作，不替代原作。</text>
  </g>

  <path class="arrow" d="M770 505 H675"/>

  <g filter="url(#shadow)">
    <rect x="410" y="430" width="250" height="150" rx="24" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="448" cy="466" r="22" fill="#5fa36d"/>
    <text x="439" y="472" class="badge">5</text>
    <text x="485" y="470" class="box-title">线上发布</text>
    <text x="445" y="510" class="box-copy">原图进 comics/</text>
    <text x="445" y="536" class="box-copy">封面进 comics/covers/</text>
    <text x="445" y="562" class="tiny">index.html 新增 comic-card。</text>
  </g>

  <path class="arrow" d="M400 505 H305"/>

  <g filter="url(#shadow)">
    <rect x="70" y="430" width="220" height="150" rx="24" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="108" cy="466" r="22" fill="#b87950"/>
    <text x="99" y="472" class="badge">6</text>
    <text x="145" y="470" class="box-title">QA 闸门</text>
    <text x="105" y="510" class="box-copy">清晰 / 无水印</text>
    <text x="105" y="536" class="box-copy">可点击 / 加载快</text>
    <text x="105" y="562" class="tiny">通过后再提交推送。</text>
  </g>

  <rect x="300" y="650" width="600" height="44" rx="22" fill="#2f251c" opacity="0.9"/>
  <text x="335" y="679" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#fff6df">判断标准：读者一眼知道是哪一期，点开能看到完整原作，创作者意图没有被稀释。</text>
</svg>

