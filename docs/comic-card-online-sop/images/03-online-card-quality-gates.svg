<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">线上发布质量闸门</title>
  <desc id="desc">线上漫画卡片发布前的叙事、视觉、资源和发布四类检查。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9ee"/>
      <stop offset="100%" stop-color="#eef7f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#4e3824" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: 700 42px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #2b2118; }
      .sub { font: 400 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #6b5a4a; }
      .gate-title { font: 700 25px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #2f251c; }
      .item { font: 400 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #594637; }
      .num { font: 700 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #fffaf0; }
      .footer { font: 700 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #fff7df; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="78" y="78" class="title">线上发布前的 4 道质量闸门</text>
  <text x="80" y="114" class="sub">只要任何一关不过，就先修复再推送。尤其注意：不要让缓存、旧图、压缩图混进最终线上版本。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="250" height="360" rx="26" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="105" cy="215" r="24" fill="#c782a7"/>
    <text x="95" y="222" class="num">01</text>
    <text x="140" y="224" class="gate-title">叙事准确</text>
    <text x="105" y="275" class="item">✓ 简介来自本期故事</text>
    <text x="105" y="315" class="item">✓ 不照搬长提示词</text>
    <text x="105" y="355" class="item">✓ 情绪和梗都说得准</text>
    <text x="105" y="395" class="item">✓ 标题、日期、期数对应</text>
    <path d="M105 455 H285" stroke="#f0d7b0" stroke-width="3"/>
    <text x="105" y="492" class="item">读者知道这期讲什么。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="175" width="250" height="360" rx="26" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="385" cy="215" r="24" fill="#6ca6b8"/>
    <text x="375" y="222" class="num">02</text>
    <text x="420" y="224" class="gate-title">视觉可读</text>
    <text x="385" y="275" class="item">✓ 封面缩小后仍清楚</text>
    <text x="385" y="315" class="item">✓ 颜色不灰、不偏色</text>
    <text x="385" y="355" class="item">✓ 字不糊、不被裁掉</text>
    <text x="385" y="395" class="item">✓ 手机端不溢出</text>
    <path d="M385 455 H565" stroke="#f0d7b0" stroke-width="3"/>
    <text x="385" y="492" class="item">卡片好看，也能读。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="175" width="250" height="360" rx="26" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="665" cy="215" r="24" fill="#5fa36d"/>
    <text x="655" y="222" class="num">03</text>
    <text x="700" y="224" class="gate-title">资源干净</text>
    <text x="665" y="275" class="item">✓ 原图和封面都无水印</text>
    <text x="665" y="315" class="item">✓ 没用聊天截图预览图</text>
    <text x="665" y="355" class="item">✓ 原图没有被低清覆盖</text>
    <text x="665" y="395" class="item">✓ 路径和引用一致</text>
    <path d="M665 455 H845" stroke="#f0d7b0" stroke-width="3"/>
    <text x="665" y="492" class="item">文件就是最终版本。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="175" width="220" height="360" rx="26" fill="#fffdf8" stroke="#e5cda9" stroke-width="2"/>
    <circle cx="945" cy="215" r="24" fill="#d99a45"/>
    <text x="935" y="222" class="num">04</text>
    <text x="980" y="224" class="gate-title">上线稳定</text>
    <text x="945" y="275" class="item">✓ 首图 eager</text>
    <text x="945" y="315" class="item">✓ 其他 lazy</text>
    <text x="945" y="355" class="item">✓ 点击打开全图</text>
    <text x="945" y="395" class="item">✓ 不提交临时文件</text>
    <path d="M945 455 H1095" stroke="#f0d7b0" stroke-width="3"/>
    <text x="945" y="492" class="item">推送后可复现。</text>
  </g>

  <rect x="195" y="610" width="810" height="62" rx="31" fill="#2f251c" opacity="0.94"/>
  <text x="248" y="649" class="footer">最终判断：线上读者看见的是清晰、准确、无水印的作品入口，而不是制作过程里的临时版本。</text>
</svg>

