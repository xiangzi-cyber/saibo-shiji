<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">线上漫画卡片结构</title>
  <desc id="desc">说明线上漫画卡片的固定骨架和可变化主题层。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9efe0"/>
      <stop offset="100%" stop-color="#edf7f7"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30224a"/>
      <stop offset="45%" stop-color="#9d5a86"/>
      <stop offset="100%" stop-color="#f3c86b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#513820" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 42px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #2b2118; }
      .sub { font: 400 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #6b5a4a; }
      .label { font: 700 22px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #33261d; }
      .copy { font: 400 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #6f5c4a; }
      .field { font: 700 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #fffdf5; }
      .arrow { stroke: #b87950; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 8; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#page)"/>
  <text x="78" y="78" class="title">线上卡片 = 固定骨架 + 单期气质</text>
  <text x="80" y="113" class="sub">漫画原作不被重画；卡片负责索引、解释、提气氛，并把读者带到完整四宫格。</text>

  <g filter="url(#shadow)">
    <rect x="430" y="150" width="340" height="520" rx="26" fill="#17172f" stroke="#f3c86b" stroke-width="4"/>
    <rect x="455" y="175" width="290" height="260" rx="18" fill="url(#cover)" stroke="#fff3cf" stroke-width="3"/>
    <g opacity="0.85">
      <rect x="480" y="200" width="102" height="90" rx="10" fill="#fff8e7"/>
      <rect x="618" y="200" width="102" height="90" rx="10" fill="#fff8e7"/>
      <rect x="480" y="318" width="102" height="90" rx="10" fill="#fff8e7"/>
      <rect x="618" y="318" width="102" height="90" rx="10" fill="#fff8e7"/>
      <circle cx="532" cy="244" r="24" fill="#f7b46d"/>
      <circle cx="670" cy="244" r="24" fill="#9fd7e5"/>
      <circle cx="532" cy="362" r="24" fill="#c782a7"/>
      <circle cx="670" cy="362" r="24" fill="#f3c86b"/>
    </g>
    <rect x="455" y="455" width="118" height="32" rx="16" fill="#f3c86b"/>
    <rect x="588" y="455" width="118" height="32" rx="16" fill="#9fd7e5"/>
    <text x="480" y="477" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2f251c">2026.06.01</text>
    <text x="617" y="477" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2f251c">第 13 期</text>
    <text x="455" y="525" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#fff8df">赛博史记之永远的乐园</text>
    <text x="455" y="565" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#d8d7eb">猫咪大老板窝在 AGI Bar 茶杯里，</text>
    <text x="455" y="589" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#d8d7eb">额度会重置，快乐不重置。</text>
    <rect x="455" y="615" width="130" height="36" rx="18" fill="#f3c86b"/>
    <text x="485" y="638" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#2f251c">查看全图</text>
  </g>

  <path class="arrow" d="M410 220 C320 210, 270 210, 220 235"/>
  <rect x="70" y="205" width="260" height="86" rx="18" fill="#fffdf8" stroke="#dfc6a2" stroke-width="2"/>
  <text x="95" y="238" class="label">封面图</text>
  <text x="95" y="266" class="copy">轻量、清晰、无水印</text>

  <path class="arrow" d="M410 472 C322 472, 270 450, 220 430"/>
  <rect x="70" y="385" width="280" height="100" rx="18" fill="#fffdf8" stroke="#dfc6a2" stroke-width="2"/>
  <text x="95" y="420" class="label">固定信息骨架</text>
  <text x="95" y="448" class="copy">日期、期数、标题、简介</text>
  <text x="95" y="474" class="copy">每期都要稳定出现</text>

  <path class="arrow" d="M790 325 C900 316, 945 285, 995 245"/>
  <rect x="875" y="185" width="260" height="108" rx="18" fill="#fffdf8" stroke="#dfc6a2" stroke-width="2"/>
  <text x="900" y="220" class="label">单期气质</text>
  <text x="900" y="248" class="copy">色彩、视觉锚点、故事语气</text>
  <text x="900" y="274" class="copy">服务内容，不抢内容</text>

  <path class="arrow" d="M790 620 C905 630, 945 600, 995 555"/>
  <rect x="875" y="510" width="260" height="108" rx="18" fill="#fffdf8" stroke="#dfc6a2" stroke-width="2"/>
  <text x="900" y="545" class="label">完整原作入口</text>
  <text x="900" y="573" class="copy">lightbox 打开原图</text>
  <text x="900" y="599" class="copy">不让封面替代四宫格</text>

  <rect x="105" y="620" width="260" height="46" rx="23" fill="#2f251c" opacity="0.92"/>
  <text x="132" y="650" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#fff7dc">卡片是入口，不是重画。</text>
</svg>

